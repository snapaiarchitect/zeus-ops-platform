# Mirrors the services that exist on Render today. The database is Supabase (see PROTOTYPE.md).
services:
  - type: web
    name: zeus-ops-platform
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL        # Supabase session-pooler connection string (IPv4)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL          # frontend origin(s), comma-separated, for CORS
        value: https://zeus-ops-frontend.onrender.com
      - key: APP_URL
        value: https://zeus-ops-frontend.onrender.com
      - key: ADMIN_EMAIL         # first-admin bootstrap; remove ADMIN_PASSWORD after first login
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: zeus-ops-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://zeus-ops-platform.onrender.com
